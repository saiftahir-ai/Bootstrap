<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Buttons</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">
        <h1 class="mb-4">Bootstrap Buttons</h1>

        <!-- 1. Basic Buttons -->
        <h3>1. Basic Buttons</h3>
        <button class="btn btn-primary">Button</button>
        <a href="#" class="btn btn-primary">Link Button</a>
        <input type="submit" value="Input Button" class="btn btn-primary">
        <hr>

        <!-- 2. Button Variants -->
        <h3>2. Button Variants</h3>
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark">Dark</button>
        <button class="btn btn-link">Link</button>
        <hr>


        <!-- 3. Outline Buttons -->
        <h3>3. Outline Buttons</h3>
        <button class="btn btn-outline-primary">Primary</button>
        <button class="btn btn-outline-secondary">Secondary</button>
        <button class="btn btn-outline-success">Success</button>
        <button class="btn btn-outline-danger">Danger</button>
        <button class="btn btn-outline-warning">Warning</button>
        <button class="btn btn-outline-info">Info</button>
        <button class="btn btn-outline-light">Light</button>
        <button class="btn btn-outline-dark">Dark</button>
        <hr>


        <!-- 4. Button Sizes -->
        <h3>4. Button Sizes</h3>
        <button class="btn btn-primary btn-lg">Large</button>
        <button class="btn btn-primary">Default</button>
        <button class="btn btn-primary btn-sm">Small</button>

        <div class="d-grid gap-2 mt-3">
            <button class="btn btn-success">Full Width Button (d-grid)</button>
        </div>
        <hr>

        <!-- 5. Disabled Buttons -->
        <h3>5. Disabled Buttons</h3>
        <button class="btn btn-primary" disabled>Disabled Button</button>
        <button class="btn btn-outline-danger" disabled>Disabled Outline</button>
        <a href="#" class="btn btn-secondary disabled" aria-disabled="true" tabindex="-1">Disabled Link</a>
        <hr>

        <!-- 6. Button Groups -->
        <h3>6. Button Groups</h3>

        <p class="mb-1">Horizontal group:</p>
        <div class="btn-group" role="group" aria-label="Basic group">
            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>
        </div>

        <p class="mt-3 mb-1">Group sizes (large / small):</p>
        <div class="btn-group btn-group-lg" role="group">
            <button class="btn btn-outline-dark">One</button>
            <button class="btn btn-outline-dark">Two</button>
            <button class="btn btn-outline-dark">Three</button>
        </div>
        <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-dark">One</button>
            <button class="btn btn-outline-dark">Two</button>
            <button class="btn btn-outline-dark">Three</button>
        </div>

        <p class="mt-3 mb-1">Vertical group:</p>
        <div class="btn-group-vertical" role="group">
            <button class="btn btn-success">Top</button>
            <button class="btn btn-success">Center</button>
            <button class="btn btn-success">Bottom</button>
        </div>

        <p class="mt-3 mb-1">Button toolbar (multiple group):</p>
        <div class="btn-toolbar" role="toolbar">
            <div class="btn group me-2" role="group">
                <button class="btn btn-secondary">1</button>
                <button class="btn btn-secondary">2</button>
                <button class="btn btn-secondary">3</button>
            </div>
            <div class="btn-group" role="group">
                <button class="btn btn-danger">4</button>
                <button class="btn btn-danger">5</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
